title: "Orders (Page %page%)"
size: 54
slots:
  yourordergui:
    slot: 46
    type: OpenYourOrderGui
    material: CHEST
    name: "<white>Your Orders"
    lore:
      -
  search:
    slot: 46
    type: SearchSlot
    material: HOPPER
    name: "<red>Search"
    lore:
      -  "<dark_gray>Currently searching: <dark_red>%search%"

  nextpage:
    slot: 53
    type: NextPage
    material: GREEN_STAINED_GLASS_PANE
    name: "<b><green>Next Page"
    lore:
      -
  lastpage:
    slot: 52
    type: LastPage
    material: RED_STAINED_GLASS_PANE
    name: "<b><red>Previous Page"
    lore:
      -
  filter:
    slot: 45
    type: FilterSlot
    material: EMERALD
    name: <white>Filter
    lore:
      - "<gray>Click to change"
      - ""
      - "<white> %most_per_item%"
      - "<white> %most_paid%"