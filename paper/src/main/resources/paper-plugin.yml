name: ChamoOrders
authors: [ "SQD Studios" ]
website: "https://github.com/SQD-Studios/ChamoOrders"
version: '${version}'

main: com.sqdstudios.chamoorders.ChamoOrdersPlugin
loader: com.sqdstudios.chamoorders.ChamoOrdersLoader
api-version: '1.21.11'

folia-supported: true

dependencies:
  server:
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  chamoparty.order:
    default: true

  chamoorders.admin:
    default: op
    description: "Allows using the admin commands"
    children:
      chamoorders.admin.reload: true

  chamoorders.orderlimit.<limit>:
    default: false

  chamoorders.orderlimit.8:
    default: true